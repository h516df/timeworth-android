name: Original-key product acceptance
on:
  workflow_call:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          # Product PR #15 has merged; freeze its current main source for this acceptance.
          ref: e3251591bbdc8459c05d646fd2dd42a2371682f8
          path: product
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: policy
          persist-credentials: false
          sparse-checkout: |
            cloud/check_apk_identity.py
            cloud/test_apk_identity.py
            release/signing-identity.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Check policy and product rules without signing credentials
        run: |
          python3 -m unittest discover -s policy/cloud -p test_apk_identity.py -v
          node --test product/ui-preview/qa/finance.test.cjs
      - name: Build the real product without original signing credentials
        run: |
          sdkmanager 'platforms;android-35' 'platforms;android-36' 'build-tools;36.0.0' >/dev/null
          bash product/android/gradlew -p product/android --no-daemon --max-workers=1 :app:assembleDebug :app:assembleRelease
      - name: Inspect actual development and unsigned production APKs
        run: |
          python3 policy/cloud/check_apk_identity.py product/android/app/build/outputs/apk/debug/app-debug.apk --variant development
          python3 policy/cloud/check_apk_identity.py product/android/app/build/outputs/apk/release/app-release-unsigned.apk --variant release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: timeworth-product-inputs-${{ github.sha }}
          path: |
            product/android/app/build/outputs/apk/debug/app-debug.apk
            product/android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 3
  sign:
    needs: build
    if: github.repository == 'h516df/timeworth-android' && github.ref == 'refs/heads/codex/cloud-signing-prep-20261022'
    environment: android-signing
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          sparse-checkout: |
            cloud/sign_apk.py
            cloud/KeyProbe.java
            cloud/check_signing_readiness.py
            release/signing-identity.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' >/dev/null
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: timeworth-product-inputs-${{ github.sha }}
          path: ${{ runner.temp }}/product-inputs
      - name: Sign the actual product using only environment-specific credential names
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.TIMEWORTH_ORIGINAL_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.TIMEWORTH_ORIGINAL_KEYSTORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.TIMEWORTH_ORIGINAL_KEYSTORE_PASSWORD }}
        run: |
          python3 cloud/sign_apk.py --input "$RUNNER_TEMP/product-inputs/release/app-release-unsigned.apk" --output "$RUNNER_TEMP/acceptance/acceptance.apk" > "$RUNNER_TEMP/product-receipt.json"
          cat "$RUNNER_TEMP/product-receipt.json"
          python3 cloud/check_signing_readiness.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: timeworth-signed-acceptance-${{ github.sha }}
          path: |
            ${{ runner.temp }}/acceptance/acceptance.apk
            ${{ runner.temp }}/product-receipt.json
          if-no-files-found: error
          retention-days: 3
