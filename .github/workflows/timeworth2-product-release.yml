name: TimeWorth 2.0 product build and release
on:
  pull_request:
    paths:
      - 'android/**'
      - 'ui-preview/dist/**'
      - 'ui-preview/qa/timeworth2*'
      - 'ui-preview/qa/finance.test.cjs'
      - '.github/workflows/timeworth2-product-release.yml'
      - 'release/v2.0.0-notes.md'
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'ui-preview/dist/**'
      - 'ui-preview/qa/timeworth2*'
      - 'ui-preview/qa/finance.test.cjs'
      - '.github/workflows/timeworth2-product-release.yml'
      - 'release/v2.0.0-notes.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: timeworth2-product-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Finance, OCR, migration and comparison regressions
        run: |
          node --test ui-preview/qa/finance.test.cjs ui-preview/qa/timeworth2.cjs ui-preview/qa/timeworth2-ocr.cjs ui-preview/qa/timeworth2-scenarios.cjs ui-preview/qa/timeworth2-migration.cjs
          git diff --check
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Build real app without any signing secret
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;36.0.0' >/dev/null
          bash android/gradlew -p android --no-daemon --max-workers=1 :app:assembleDebug :app:assembleRelease
      - name: Check compiled package and build identity
        run: |
          python3 cloud/check_apk_identity.py android/app/build/outputs/apk/debug/app-debug.apk --variant development
          python3 cloud/check_apk_identity.py android/app/build/outputs/apk/release/app-release-unsigned.apk --variant release
          python3 -c 'import pathlib,subprocess; f=pathlib.Path("android/app/build/outputs/apk/release/app-release-unsigned.apk"); text=subprocess.check_output([str(pathlib.Path(__import__("os").environ["ANDROID_HOME"])/"build-tools/36.0.0/aapt2"),"dump","badging",str(f)],text=True); assert "versionCode=\x272\x27" in text and "versionName=\x272.0.0\x27" in text,text[:500]'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: timeworth2-unsigned-${{ github.sha }}
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 5

  sign:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'h516df/timeworth-android'
    environment: android-signing
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' >/dev/null
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: timeworth2-unsigned-${{ github.sha }}
          path: ${{ runner.temp }}/unsigned
      - name: Sign only with the already-protected original keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.TIMEWORTH_ORIGINAL_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.TIMEWORTH_ORIGINAL_KEYSTORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.TIMEWORTH_ORIGINAL_KEYSTORE_PASSWORD }}
        run: |
          python3 cloud/sign_apk.py --input "$RUNNER_TEMP/unsigned/app-release-unsigned.apk" --output "$RUNNER_TEMP/timeworth-2.0.0.apk" > "$RUNNER_TEMP/signing-receipt.json"
          python3 -c 'import json,pathlib; d=json.loads((pathlib.Path(__import__("os").environ["RUNNER_TEMP"])/"signing-receipt.json").read_text()); assert d["privateKeyVerified"] and d["apkSignatureVerified"] and not d["syntheticProbe"]; assert d["certificateSha256"]==json.loads(pathlib.Path("release/signing-identity.json").read_text())["certificateSha256"]'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: timeworth2-original-signed-${{ github.sha }}
          path: |
            ${{ runner.temp }}/timeworth-2.0.0.apk
            ${{ runner.temp }}/signing-receipt.json
          if-no-files-found: error
          retention-days: 15

  publish:
    needs: sign
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'h516df/timeworth-android'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: timeworth2-original-signed-${{ github.sha }}
          path: ${{ runner.temp }}/release
      - name: Reject identity mismatch or non-release builds
        run: |
          python3 -c 'import json,hashlib,pathlib,os; p=pathlib.Path(os.environ["RUNNER_TEMP"])/"release"; apk=p/"timeworth-2.0.0.apk"; receipt=json.loads((p/"signing-receipt.json").read_text()); identity=json.loads(pathlib.Path("release/signing-identity.json").read_text()); assert receipt["packageName"]==identity["packageName"] and receipt["certificateSha256"]==identity["certificateSha256"]; assert receipt["size"]==apk.stat().st_size and receipt["sha256"]==hashlib.sha256(apk.read_bytes()).hexdigest()'
      - name: Create immutable release assets without replacing an existing version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v2.0.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'v2.0.0 already exists. Refusing to overwrite a published APK.' >&2
            exit 1
          fi
          gh release create v2.0.0 "$RUNNER_TEMP/release/timeworth-2.0.0.apk" "$RUNNER_TEMP/release/signing-receipt.json" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'TimeWorth 2.0.0' --notes-file release/v2.0.0-notes.md --latest
          gh release view v2.0.0 --repo "$GITHUB_REPOSITORY" --json url,assets,isDraft,isPrerelease
