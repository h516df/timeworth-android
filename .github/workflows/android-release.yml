name: Android signed build
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: timeworth-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '21'
      - name: Check financial rules
        run: node --test ui-preview/qa/finance.test.cjs
      - name: Build with original signing identity
        shell: bash
        env:
          TIMEWORTH_KEYSTORE_BASE64: ${{ secrets.TIMEWORTH_KEYSTORE_BASE64 }}
          TIMEWORTH_KEYSTORE_PASSWORD: ${{ secrets.TIMEWORTH_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$TIMEWORTH_KEYSTORE_BASE64"
          test -n "$TIMEWORTH_KEYSTORE_PASSWORD"
          umask 077
          task_signing_dir=$(mktemp -d "$RUNNER_TEMP/timeworth-signing.XXXXXX")
          trap 'rm -rf "$task_signing_dir"' EXIT
          printf '%s' "$TIMEWORTH_KEYSTORE_BASE64" | base64 --decode > "$task_signing_dir/release.p12"
          keytool -exportcert -keystore "$task_signing_dir/release.p12" -alias timeworth -storepass:env TIMEWORTH_KEYSTORE_PASSWORD -file "$task_signing_dir/certificate.der" >/dev/null
          python3 - "$task_signing_dir/certificate.der" <<'PY'
          import hashlib, json, pathlib, sys
          expected = json.loads(pathlib.Path('release/signing-identity.json').read_text())['certificateSha256']
          assert hashlib.sha256(pathlib.Path(sys.argv[1]).read_bytes()).hexdigest() == expected, 'Signing certificate mismatch'
          PY
          export TIMEWORTH_KEYSTORE_FILE="$task_signing_dir/release.p12"
          bash android/gradlew -p android --no-daemon :app:assembleRelease
          mkdir -p release-output
          cp android/app/build/outputs/apk/release/app-release.apk release-output/timeworth-0.1.0.apk
          python3 tools/verify-apk.py release-output/timeworth-0.1.0.apk --expect-release --output release-output/apk-metadata.json
          cd release-output
          sha256sum timeworth-0.1.0.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: timeworth-signed-${{ github.sha }}
          path: release-output/
          retention-days: 7
          if-no-files-found: error
