name: Publish verified TimeWorth APK
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: timeworth-release-v0.1.0
  cancel-in-progress: false
jobs:
  upload:
    runs-on: [self-hosted, linux, x64, timeworth-release-20261021]
    timeout-minutes: 10
    env:
      ANDROID_HOME: /workspace/android-sdk
      JAVA_HOME: /workspace/jdk21
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Verify existing original-key release APK
        shell: bash
        run: |
          set -euo pipefail
          cd release/downloads/v0.1.0-signed
          sha256sum --check SHA256SUMS.txt
          cd ../../..
          python3 tools/verify-apk.py release/downloads/v0.1.0-signed/timeworth-0.1.0.apk --expect-release
      - name: Upload verified files as native Release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload v0.1.0 --repo "$GITHUB_REPOSITORY" \
            release/downloads/v0.1.0-signed/timeworth-0.1.0.apk \
            release/downloads/v0.1.0-signed/apk-metadata.json \
            release/downloads/v0.1.0-signed/SHA256SUMS.txt \
            release/downloads/v0.1.0-signed/SOURCE_SHA.txt
